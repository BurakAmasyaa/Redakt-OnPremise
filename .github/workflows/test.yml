# Sızıntı testinin depoyu gerçekten koruması için her değişiklikte çalışması gerekir.
# tests/output-leak.test.js burada düşerse maskelenmemiş bir belge parçası var demektir.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
