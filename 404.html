<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Sayfa bulunamadı — Redakt</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/switzer-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/switzer-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/switzer-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="grain-overlay" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Redakt anasayfa">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" focusable="false">
            <path class="brand-page" d="M7 4h10l4 4v16H7z" />
            <path class="brand-fold" d="M17 4v4h4z" />
            <rect class="brand-redaction" x="10" y="12" width="8" height="2.3" rx="1.15" />
            <rect class="brand-redaction" x="10" y="17" width="6" height="2.3" rx="1.15" />
          </svg>
        </span>
        <span>Redakt</span>
      </a>
      <div class="nav-meta">
        <div class="local-badge">
          <span class="local-pulse" aria-hidden="true"></span>
          Verin sende saklı
        </div>
      </div>
    </header>

    <main class="not-found-main">
      <section class="not-found-copy" aria-labelledby="not-found-title">
        <div class="not-found-motif" aria-hidden="true">
          <span>404</span>
          <i></i>
        </div>
        <h1 id="not-found-title">Bu sayfa bulunamadı.</h1>
        <p>Adres değişmiş veya yanlış yazılmış olabilir.</p>
        <a class="secondary-button pressable not-found-link" href="/">
          Ana sayfaya dön <span aria-hidden="true">→</span>
        </a>
      </section>
    </main>
  </body>
</html>
